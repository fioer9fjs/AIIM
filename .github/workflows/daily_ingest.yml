name: Daily AI Incident Ingestion Pipeline

on:
  schedule:
    # Run once daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for Workload Identity Federation OIDC authentication
    steps:
      - name: Checkout Code (Native Git)
        run: |
          git clone https://github.com/fioer9fjs/AIIM.git .
          git checkout main

      - name: Install Python Dependencies (Native Python 3)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run Ingestion & Extraction Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          python3 scripts/ingest.py

      - name: Commit & Push Updated Dataset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add src/data/
          git status
          git diff --staged --quiet || (git commit -m "auto: daily AI incident dataset update" && git push)
