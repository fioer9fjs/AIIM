name: 7-Day Historical AI Incident Backfill

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for Workload Identity Federation OIDC authentication
    steps:
      - name: Checkout Code (Native Git)
        run: |
          git clone https://github.com/fioer9fjs/AIIM.git .
          git checkout main

      - name: Install Python Dependencies (Native Python 3)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run 7-Day Historical Backfill Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          python3 scripts/backfill.py

      - name: Commit & Push Backfilled Dataset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add src/data/
          git status
          git diff --staged --quiet || (git commit -m "auto: 7-day historical backfill dataset update" && git push)
