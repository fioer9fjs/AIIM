name: 7-Day Historical AI Incident Backfill

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-generativeai beautifulsoup4 requests pydantic

      - name: Run 7-Day Historical Backfill Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/backfill.py

      - name: Commit & Push Backfilled Dataset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add src/data/
          git status
          git diff --staged --quiet || (git commit -m "auto: 7-day historical backfill dataset update" && git push)
